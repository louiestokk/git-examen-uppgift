<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <title>Git-uppgift</title>
  </head>
  <body>
    <h1>Git-uppgift</h1>
    
    <script>
        const container = document.createElement("div")
        document.body.appendChild(container)
        const userName = document.createElement("h2")
        userName.textContent = hamtaNamn("Louie Al-saffar")
        container.appendChild(userName)
        const summa = document.createElement("h3")
        summa.textContent = `Summa: ${addera(6,6)}`
        container.appendChild(summa)
        const status = document.createElement("h4")
        status.textContent = statusForTal(11)
        container.appendChild(status)
        
      function hamtaNamn(name) {
        return name;
      }

      function addera(a, b) {
        return a + b;
      }

      function statusForTal(tal) {
        if(tal > 10) return "ok";
        else return "för låg";
      }

    </script>
  </body>
</html>
